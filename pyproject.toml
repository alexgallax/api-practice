[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "api-practice"
version = "0.1.0"
description = "Учебный проект по автоматизации и тестированию API"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pytest>=8.0",
    "requests>=2.34",
    "pydantic>=2.14",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api_practice*"]

[tool.pytest.ini_options]
minversion = "7.0"

testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

addopts = """
    -ra
    --strict-markers
"""